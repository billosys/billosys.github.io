# Cobalt configuration for billo.systems
# Refs: CB-19 (config), CB-24 (sass), CB-03 (directory convention).
# All settings here are optional; values listed are explicit for clarity.

# ───────── Build options ─────────
source: "."
destination: site              # The `site/` worktree, branch `site`, GH Pages deploys from it.
template_extensions:
  - md
  - liquid
include_drafts: false

# Paths Cobalt must not treat as site sources.
# `/site` is the worktree (build output) and must never be re-scanned.
# `/workbench` is the local design-system / strategy scratchpad (gitignored).
# README.md and .git are repo metadata, not site content.
ignore:
  - site/**/*
  - workbench/**/*
  - docs/**/*                # planning artifacts (slice-doc, ledger, cc-prompt) — not site content
  - pagefind.yml             # pagefind reads this from the project root at index time; must NOT be copied into site/
  - README.md
  - .git/**/*
  - .gitignore

# ───────── Site metadata ─────────
site:
  title: Billo Systems
  description: Careful engineering at serious scale.
  base_url: https://billo.systems

# ───────── Frontmatter defaults ─────────
# Applied to every page/post unless overridden in that file's own frontmatter.
default:
  is_draft: false
  excerpt_separator: "\n\n"

# ───────── Page defaults ─────────
pages:
  default:
    layout: secondary.liquid

# ───────── Posts (the Articles blog) ─────────
# Cobalt's built-in blog collection — powers /articles/, /archive/, /tags/.
# Markdown posts live in /posts. Newest-first; the templates assume Desc.
# No `rss:` key here: hand-written rss.xml / atom.xml (pagination: All) give
# author + category control the built-in generator doesn't. Tags-only by
# design — no categories.
posts:
  title: Articles
  description: Field notes on distributed systems, Erlang/OTP, and correctness under contention.
  dir: posts
  drafts_dir: _drafts
  order: Desc
  default:
    layout: blog-post.liquid
    permalink: "/articles/{{ year }}/{{ month }}/{{ slug }}/"

# ───────── Asset processing ─────────
assets:
  sass:
    style: Compressed          # Production-minified CSS.

# ───────── Syntax highlighting ─────────
# Cobalt-native (syntect) highlighting is DISABLED on purpose. This Cobalt
# (0.20.2) delegates to `engarde`, whose Syntax::new() takes no args and only
# knows syntect's built-in themes — it can't load our custom _syntaxes/ .tmTheme
# and hard-errors the build on any unknown theme name. So we turn it off; fenced
# code blocks emit clean <pre><code class="language-*">, which self-hosted
# Prism.js (/assets/js/prism.js, loaded by blog-post.liquid) highlights in the
# browser. Colours come from the --code-* tokens in _sass/_blog-components.scss,
# so the palette stays live in the design tokens. See
# docs/design-v2.1.0/02-syntax-highlighting/. (L-02.)
syntax_highlight:
  enabled: false
