# Pagefind search config. Run as a post-build step (reads this file from the
# project root) by scripts/deploy.sh (deploy) and scripts/preview.sh (local):
#   pagefind --site site
# pagefind is a standalone tool — not a Cobalt change or a custom CLI. It writes
# site/pagefind/* (JS, CSS, wasm, index), which /search/ loads. Indexing is
# scoped to posts by `data-pagefind-body` on the post <article> (blog-post.liquid);
# the glob below is a coarse pre-filter. See docs/design-v2.1.0/04-search/.
site: site
glob: "articles/**/*.html"
exclude_selectors:
  - ".blog-nav"
  - ".blog-footer"
  - ".post-nav"
  - ".author-card"
  - ".skip-link"
